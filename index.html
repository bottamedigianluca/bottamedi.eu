        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-ZYL9HZJKCE';

          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-ZYL9HZJKCE', { send_page_view: true, anonymize_ip: true });
          window.track = function(event, params){
            gtag('event', event, {
              event_category: (params && params.category) || 'General',
              event_label: (params && params.label) || '',
              value: (params && params.value) || 1
            });
          };
        };
      }
      ['scroll','click','touchstart','keydown'].forEach(function(ev){
        window.addEventListener(ev, loadAnalytics, { once: true, passive: true });
      });
      setTimeout(loadAnalytics, 4000);
    })();
  </script>

  <!-- Web Vitals e scroll tracking leggero -->
  <script>
    (function(){
      function hideLoading(){
        document.body.classList.add('loaded');
        var el = document.getElementById('loading-screen');
        if(el){ setTimeout(function(){ el.remove(); }, 500); }
      }
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', hideLoading);
      } else {
        hideLoading();
      }
      // Scroll depth
      var scrollTimer, maxScroll = 0;
      window.addEventListener('scroll', function(){
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function(){
          var pct = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
          if(pct > maxScroll){
            maxScroll = pct;
            if(window.track){
              if(maxScroll >= 25 && maxScroll < 30) window.track('scroll_depth', { label: '25%', value: 1 });
              else if(maxScroll >= 50 && maxScroll < 55) window.track('scroll_depth', { label: '50%', value: 2 });
              else if(maxScroll >= 75 && maxScroll < 80) window.track('scroll_depth', { label: '75%', value: 3 });
              else if(maxScroll >= 90) window.track('scroll_depth', { label: '90%', value: 5 });
            }
          }
        }, 150);
      }, { passive: true });
      // LCP via PO
      if('PerformanceObserver' in window){
        try {
          var po = new PerformanceObserver(function(list){
            for(var i=0;i<list.getEntries().length;i++){
              var e = list.getEntries()[i];
              if(e.entryType === 'largest-contentful-paint' && window.track){
                window.track('web_vitals', { label: 'LCP', value: Math.round(e.startTime) });
              }
            }
          });
          po.observe({ entryTypes: ['largest-contentful-paint'] });
        } catch(e){}
      }
    })();
  </script>
