[build]
  command = "npm install && npm run build && npm run prerender"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Cache per assets statici
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache per immagini
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Il sito e' una pagina sola: le uniche rotte valide sono / e i file statici.
# Il catch-all su index.html con status 200 faceva restituire 200 a qualsiasi
# URL inventata, quindi Google poteva indicizzare pagine inesistenti (soft 404).
# Netlify serve automaticamente public/404.html con status 404 per il resto.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Header di sicurezza: erano presenti solo HSTS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# llms.txt e robots.txt devono restare leggibili e non cacheati a lungo
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"
