[build]
  # npx puppeteer browsers install: su Netlify il postinstall di puppeteer non
  # gira (i pacchetti arrivano dalla cache) e il Chromium non viene scaricato,
  # quindi il prerendering fallisce e ferma il deploy.
  command = "npm install && npx puppeteer browsers install chrome && npm run build && npm run prerender"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

# Cache per assets statici
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache per immagini
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Il sito e' una pagina sola: le uniche rotte valide sono / e i file statici.
# Il catch-all su index.html con status 200 faceva restituire 200 a qualsiasi
# URL inventata, quindi Google poteva indicizzare pagine inesistenti (soft 404).
# Netlify serve automaticamente public/404.html con status 404 per il resto.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Header di sicurezza: erano presenti solo HSTS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # CSP permissiva su script e stili: il sito usa stili inline generati da
    # framer-motion e il tracking GA/Ads. Restringerla oltre romperebbe il
    # rendering. Vieta comunque plugin, frame esterni e form verso terzi.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://region1.google-analytics.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# llms.txt e robots.txt devono restare leggibili e non cacheati a lungo
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"
